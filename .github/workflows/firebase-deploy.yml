name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify and Inspect Secret Format
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node -e '
            const s = process.env.SA_JSON || "";
            const t = process.env.FB_TOKEN || "";
            console.log("Secret length:", s.length, "Token length:", t.length);
            if (s.startsWith("{")) {
              try {
                const j = JSON.parse(s);
                console.log("Valid JSON format! Project ID:", j.project_id, "Client Email:", j.client_email);
              } catch(e) {
                console.log("Starts with { but invalid JSON:", e.message);
              }
            } else if (s.includes("require") || s.includes("admin.")) {
              console.log("⚠️ ATENCIÓN: El secreto contiene código JavaScript (var admin = require...), en lugar del archivo JSON.");
            } else {
              console.log("Secret starts with:", s.slice(0, 15));
            }
          '

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm install
          cd ..

      - name: Deploy to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "$SA_JSON" > "$RUNNER_TEMP/sa_key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa_key.json"
            
            PID=$(jq -r '.project_id // empty' "$RUNNER_TEMP/sa_key.json" 2>/dev/null || true)
            if [ -n "$PID" ] && [ "$PID" != "null" ]; then
              echo "✅ Usando proyecto Firebase: $PID"
              echo "{\"projects\":{\"default\":\"$PID\"}}" > .firebaserc
              npx firebase-tools deploy --project "$PID" --non-interactive
              exit 0
            fi
          fi

          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --token "$FIREBASE_TOKEN" --non-interactive
            exit 0
          fi

          echo "❌ No se pudo autenticar. Verifica el contenido del secreto en GitHub."
          exit 1
