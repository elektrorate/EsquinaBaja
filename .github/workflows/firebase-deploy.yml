name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Firebase Credentials
        id: check_token
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ] || [ -n "$FB_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ Credenciales de Firebase detectadas."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No se detectaron credenciales en GitHub Secrets."
          fi

      - name: Install Web Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install

      - name: Build Web Application
        if: steps.check_token.outputs.has_token == 'true'
        run: npm run build

      - name: Install Functions Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd functions
          npm install
          cd ..

      - name: Deploy to Firebase
        if: steps.check_token.outputs.has_token == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "$SA_JSON" > "$RUNNER_TEMP/sa_key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa_key.json"
            
            PID=$(jq -r '.project_id // empty' "$RUNNER_TEMP/sa_key.json" 2>/dev/null || true)
            if [ -n "$PID" ] && [ "$PID" != "null" ]; then
              echo "✅ Usando proyecto Firebase detectado: $PID"
              echo "{\"projects\":{\"default\":\"$PID\"}}" > .firebaserc
            fi
          fi

          npx firebase-tools deploy --non-interactive
