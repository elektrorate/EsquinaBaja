name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Firebase Credentials
        id: check_token
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] || [ -n "${{ secrets.GCP_SA_KEY }}" ] || [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ Credenciales de Firebase detectadas en GitHub Secrets."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No se detectaron credenciales en GitHub Secrets."
          fi

      - name: Detect Firebase Project ID
        if: steps.check_token.outputs.has_token == 'true'
        id: detect_project
        run: |
          SA_CONTENT='${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}'
          PID=$(echo "$SA_CONTENT" | jq -r '.project_id // empty' 2>/dev/null || true)
          if [ -n "$PID" ] && [ "$PID" != "null" ]; then
            echo "project_id=$PID" >> $GITHUB_OUTPUT
            echo "Proyecto detectado automáticamente: $PID"
            # Actualizar .firebaserc con el proyecto real
            echo "{\"projects\":{\"default\":\"$PID\"}}" > .firebaserc
          else
            echo "project_id=" >> $GITHUB_OUTPUT
          fi

      - name: Install Web Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install

      - name: Build Web Application
        if: steps.check_token.outputs.has_token == 'true'
        run: npm run build

      - name: Install Functions Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd functions
          npm install
          cd ..

      - name: Deploy to Firebase
        if: steps.check_token.outputs.has_token == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.FIREBASE_TOKEN }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ steps.detect_project.outputs.project_id }}
