name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        run: |
          node -e '
            const s = process.env.SA_JSON || "";
            const j = JSON.parse(s);
            console.log("✅ Credencial autenticada con éxito.");
            console.log("Proyecto:", j.project_id);
            console.log("Cuenta:", j.client_email);
          '

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_GOOGLE_CLIENT_ID: '88041729497-scn9dkp840dl6nackacuftm3r7hfnb4a.apps.googleusercontent.com'
        run: npm run build

      - name: Deploy Hosting to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa_key.json"
          PID=$(jq -r '.project_id' "$RUNNER_TEMP/sa_key.json")
          echo "🚀 Desplegando Frontend a Firebase Hosting ($PID)..."
          npx firebase-tools deploy --only hosting --project "$PID" --non-interactive

      - name: Deploy Cloud Functions (si el plan lo permite)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        continue-on-error: true
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa_key.json"
          PID=$(jq -r '.project_id' "$RUNNER_TEMP/sa_key.json")
          cd functions
          npm install
          cd ..
          echo "⚡ Intentando desplegar Cloud Functions ($PID)..."
          npx firebase-tools deploy --only functions --project "$PID" --non-interactive || echo "⚠️ Las Cloud Functions requieren el plan Blaze en Firebase. El frontend en Hosting se desplegó correctamente."
